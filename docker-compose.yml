services:
  mcp:
    build: .
    command: npm run dev
    env_file:
      - .env
    environment:
      FILES_DIR: /app/files
    ports:
      - "${MCP_HTTP_PORT}:${MCP_HTTP_PORT}"
    restart: unless-stopped
    volumes:
      - "${FILES_DIR:-./files}:/app/files"
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      - stagehand-cache:/app/.cache

volumes:
  stagehand-cache: